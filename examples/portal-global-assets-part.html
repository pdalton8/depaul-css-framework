<script>
(function () {
    const dialogSelector = '.dialog[data-href*="cmd=address"]';
    const commitTarget = 'fw_lazy_commit';
    let pending = null;
    let notice = null;

    const showNotice = (message) => {
        if (notice) notice.remove();
        notice = document.createElement('div');
        notice.className = 'portal-address-notice';
        const text = document.createElement('span');
        text.setAttribute('role', 'status');
        text.setAttribute('aria-live', 'polite');
        const dismiss = document.createElement('button');
        dismiss.type = 'button';
        dismiss.setAttribute('aria-label', 'Dismiss address notification');
        dismiss.textContent = '\u00d7';
        const currentNotice = notice;
        dismiss.addEventListener('click', () => currentNotice.remove());
        notice.append(text, dismiss);
        document.body.appendChild(notice);
        text.textContent = message;
    };

    const setSaving = (state, saving) => {
        if (state.saving === saving) return;
        state.saving = saving;
        if (saving) {
            state.form.setAttribute('aria-busy', 'true');
            state.button?.setAttribute('aria-disabled', 'true');
            state.button?.classList.add('portal-address-saving');
            state.status.textContent = 'Saving your address...';
        } else {
            if (state.busyAttribute === null) state.form.removeAttribute('aria-busy');
            else state.form.setAttribute('aria-busy', state.busyAttribute);
            if (state.button) {
                if (state.disabledAttribute === null) state.button.removeAttribute('aria-disabled');
                else state.button.setAttribute('aria-disabled', state.disabledAttribute);
                state.button.classList.remove('portal-address-saving');
            }
            state.status.textContent = '';
        }
    };

    const clearPending = () => {
        if (!pending) return;
        setSaving(pending, false);
        pending.status.remove();
        if (pending.framework.Refresh === pending.refresh) {
            pending.framework.Refresh = pending.originalRefresh;
        }
        clearTimeout(pending.timer);
        pending.observer.disconnect();
        pending = null;
    };

    const completionFrame = (state, executing) => {
        const action = new URL(state.form.action, location.href);
        return [...document.querySelectorAll('iframe')].find((frame) => {
            if (frame.name !== commitTarget) return false;
            const response = frame.contentDocument;
            if (!response || response.URL === 'about:blank') return false;
            const url = new URL(response.URL);
            if (url.origin !== action.origin || url.pathname !== action.pathname ||
                url.searchParams.get('cmd') !== 'address') return false;
            const scripts = response.querySelectorAll('script');
            // Only the observed native completion response qualifies, not a generic HTTP 200.
            return scripts.length === 1 &&
                /^\s*parent\.FW\.Refresh\(\);\s*$/.test(response.documentElement.textContent) &&
                (!executing || response.currentScript === scripts[0]);
        });
    };

    const complete = (state) => {
        const dialogs = [...document.querySelectorAll('.dialog')].filter((dialog) =>
            dialog.getClientRects().length && !dialog.closest('[hidden]')
        );
        if (!state.dialog.isConnected || dialogs[dialogs.length - 1] !== state.dialog ||
            typeof state.framework.Dialog?.Unload !== 'function') return false;
        clearPending();
        state.framework.Dialog.Unload();
        showNotice('Your address has been updated.');
        if (state.opener?.isConnected) state.opener.focus();
        return true;
    };

    const begin = (form) => {
        const dialog = form.closest(dialogSelector);
        if (!dialog) return;
        if (pending?.form === form) {
            setSaving(pending, true);
            return;
        }
        const framework = window.FW;
        if (typeof framework?.Refresh !== 'function') {
            console.error('Blue Demon Domain: Slate address completion handler is unavailable.');
            return;
        }
        clearPending();
        const button = form.querySelector(':scope > .action > button.default');
        const status = document.createElement('span');
        status.className = 'portal-address-saving-status';
        status.setAttribute('role', 'status');
        status.setAttribute('aria-live', 'polite');
        form.querySelector(':scope > .action')?.appendChild(status);
        const state = {
            form, dialog, framework,
            button, status, saving: false,
            busyAttribute: form.getAttribute('aria-busy'),
            disabledAttribute: button?.getAttribute('aria-disabled') ?? null,
            opener: document.activeElement?.closest(dialogSelector) ? null : document.activeElement,
            originalRefresh: framework.Refresh
        };
        state.refresh = function () {
            if (pending === state && completionFrame(state, true) && complete(state)) return;
            return state.originalRefresh.apply(this, arguments);
        };
        state.observer = new MutationObserver(() => {
            if (!dialog.isConnected || dialog.closest('[hidden]')) {
                clearPending();
                return;
            }
            const validation = [...document.querySelectorAll('.dialog, .error')].some((element) =>
                element !== dialog && !element.contains(dialog) &&
                element.getClientRects().length && !element.closest('[hidden]') &&
                (element.matches('.dialog') || dialog.contains(element))
            );
            if (validation) setSaving(state, false);
        });
        state.observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden'] });
        state.timer = setTimeout(() => {
            if (pending !== state) return;
            clearPending();
            console.warn('Blue Demon Domain: address save completion was not received.');
            showNotice('We could not confirm the address update. Reopen the address form to check before trying again.');
        }, 120000);
        pending = state;
        framework.Refresh = state.refresh;
        setSaving(state, true);
    };

    document.addEventListener('click', (event) => {
        if (!(event.target instanceof Element)) return;
        const button = event.target.closest(dialogSelector + ' > form > .action > button');
        if (!button) return;
        if (button.classList.contains('default')) {
            if (pending?.form === button.form && pending.saving) {
                event.preventDefault();
                event.stopImmediatePropagation();
                return;
            }
            begin(button.form);
        }
        else clearPending();
    }, true);
    document.addEventListener('submit', (event) => {
        if (event.target instanceof HTMLFormElement) begin(event.target);
    }, true);
    document.addEventListener('load', (event) => {
        const state = pending;
        if (!state || !(event.target instanceof HTMLIFrameElement) ||
            event.target.name !== commitTarget) return;
        if (event.target.contentDocument?.URL === 'about:blank') return;
        if (completionFrame(state, false) === event.target && complete(state)) return;
        clearPending();
        showNotice('The address form returned without a save confirmation. Review any validation messages before trying again.');
    }, true);
})();
</script>

    <script>
        (() => {
            const hideChecklistLegend = (scope) => {
                scope.querySelectorAll('[id^="part_checklist_"]').forEach((widget) => {
                    const walker = document.createTreeWalker(widget, NodeFilter.SHOW_TEXT);
                    const legendNodes = [];
                    while (walker.nextNode()) {
                        if (/Completed checklist items|Items that still need to be completed/i.test(walker.currentNode.textContent)) {
                            legendNodes.push(walker.currentNode);
                        }
                    }

                    legendNodes.forEach((legendNode) => {
                        let sibling = legendNode.nextSibling;
                        legendNode.remove();
                        while (sibling) {
                            const nextSibling = sibling.nextSibling;
                            if (sibling.nodeType === Node.ELEMENT_NODE && sibling.tagName === 'BR') {
                                sibling.remove();
                                break;
                            }
                            if ((sibling.nodeType === Node.TEXT_NODE && sibling.textContent.trim() === '') ||
                                (sibling.nodeType === Node.ELEMENT_NODE && sibling.tagName === 'IMG')) {
                                sibling.remove();
                                sibling = nextSibling;
                                continue;
                            }
                            break;
                        }
                    });
                });
            };

            const classifyChecklistStatuses = (scope) => {
                scope.querySelectorAll('[id^="part_checklist_"] table.nohighlight.table tbody tr').forEach((row) => {
                    const status = row.cells[1]?.textContent.trim().toLowerCase() || '';
                    const state = status.includes('await') ? 'awaiting'
                        : status.includes('optional') ? 'optional'
                            : /complete|received|satisfied|waived/.test(status) ? 'complete'
                                : 'unknown';
                    row.classList.remove(
                        'portal-checklist-status--awaiting',
                        'portal-checklist-status--optional',
                        'portal-checklist-status--complete',
                        'portal-checklist-status--unknown'
                    );
                    row.classList.add('portal-checklist-status--' + state);
                });
            };

            classifyChecklistStatuses(document);
            hideChecklistLegend(document);
            new MutationObserver(() => {
                classifyChecklistStatuses(document);
                hideChecklistLegend(document);
            }).observe(document.documentElement, {
                childList: true,
                subtree: true
            });
        })();
    </script>

<script>
    (() => {
        const initializedAccordions = new WeakSet();
        const initializeAccordions = () => {
            document.querySelectorAll('.portal-accordion').forEach((accordion) => {
                if (initializedAccordions.has(accordion)) return;
                const button = [...accordion.querySelectorAll('button.w3-button')].find((candidate) =>
                    candidate.closest('.portal-accordion') === accordion &&
                    candidate.nextElementSibling?.matches('.w3-hide')
                );
                if (!button) return;
                initializedAccordions.add(accordion);
                button.nextElementSibling.classList.add('w3-show');
            });
        };
        initializeAccordions();
        new MutationObserver(initializeAccordions).observe(document.documentElement, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['class']
        });
    })();
</script>

<script>
    (() => {
        const collator = new Intl.Collator(undefined, { sensitivity: 'base', numeric: true });
        const initializeScholarshipSorting = () => {
            document.querySelectorAll('.portal-scholarship-table table').forEach((table) => {
                const headerRow = [...table.rows].find((row) => row.cells.length === 2 && [...row.cells].every((cell) => cell.tagName === 'TH'));
                if (!headerRow) return;
                [...headerRow.cells].forEach((header, column) => {
                    if (header.querySelector('.portal-scholarship-sort')) return;
                    header.scope = 'col';
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'portal-scholarship-sort';
                    button.setAttribute('aria-label', 'Sort by ' + header.textContent.trim());
                    while (header.firstChild) button.appendChild(header.firstChild);
                    header.appendChild(button);
                    button.addEventListener('keydown', (event) => {
                        if (event.key !== 'Enter' && event.key !== ' ') return;
                        event.preventDefault();
                        event.stopImmediatePropagation();
                        button.click();
                    }, true);
                    button.addEventListener('click', (event) => {
                        event.preventDefault();
                        event.stopImmediatePropagation();
                        const ascending = header.getAttribute('aria-sort') !== 'ascending';
                        [...headerRow.cells].forEach((cell) => cell.removeAttribute('aria-sort'));
                        header.setAttribute('aria-sort', ascending ? 'ascending' : 'descending');
                        const amount = (text) => {
                            const cleaned = text.trim().replace(/[$,\s]/g, '');
                            return /^-?\d+(?:\.\d+)?$/.test(cleaned) ? Number(cleaned) : null;
                        };
                        [...table.tBodies].forEach((body) => {
                            const rows = [...body.rows].filter((row) => row.cells.length === 2 && [...row.cells].every((cell) => cell.tagName === 'TD'));
                            rows.sort((left, right) => {
                                const a = left.cells[column].textContent.trim();
                                const b = right.cells[column].textContent.trim();
                                if (column === 0) return collator.compare(a, b) * (ascending ? 1 : -1);
                                const x = amount(a), y = amount(b);
                                if (x === null || y === null) {
                                    if (x === y) return collator.compare(a, b);
                                    return x === null ? 1 : -1;
                                }
                                return (x - y) * (ascending ? 1 : -1);
                            });
                            rows.forEach((row) => body.appendChild(row));
                        });
                    }, true);
                });
            });
        };
        initializeScholarshipSorting();
        new MutationObserver(initializeScholarshipSorting).observe(document.documentElement, {
            childList: true,
            subtree: true
        });
    })();
</script>

<script>
    (function () {
        const selectorSources = window.portalApplicationSelectorSources
            || (window.portalApplicationSelectorSources = new WeakMap());
        function isHiddenBySlate(element) {
            for (let current = element; current; current = current.parentElement) {
                if (current.classList.contains('portal-application-context')) continue;
                const style = getComputedStyle(current);
                if (current.hidden || style.display === 'none' ||
                    style.visibility === 'hidden' || style.visibility === 'collapse') return true;
            }
            return false;
        }

        function initializePortalApplicationContext() {
            const mount = document.querySelector('.portal-domain-hero__inner > div, .bdd-dynamic-hero__inner > div')
                || document.querySelector('.part.portal-slot--hero')
                || document.querySelector('.page-intro, .preview-content')
                || document.querySelector('.part.application-selector');
            if (!mount) return;

            const liveSelector = document.querySelector('.part.application-selector select')
                || [...document.querySelectorAll('select[onchange]')].find((select) =>
                /\/apply\/\?id=/.test(select.getAttribute('onchange') || '')
            ) || document.querySelector('.portal-application-context select.portal-application-context__select');

            // If there is no real Slate application selector on this page, do NOT render the dropdown!
            if (!liveSelector) {
                const existingContext = document.querySelector('.portal-application-context');
                if (existingContext) existingContext.remove();
                return;
            }

            let context = document.querySelector('.portal-application-context');
            if (!selectorSources.has(liveSelector) && !liveSelector.closest('.portal-application-context')) {
                selectorSources.set(liveSelector, liveSelector.parentElement);
            }
            const source = selectorSources.get(liveSelector);
            if (isHiddenBySlate(liveSelector) || (source && (!source.isConnected || isHiddenBySlate(source)))) {
                if (context && !context.hidden) context.hidden = true;
                return;
            }
            if (context?.hidden) context.hidden = false;
            if (!liveSelector.id) liveSelector.id = 'portalApplicationSelect';
            if (!liveSelector.classList.contains('portal-application-context__select')) {
                liveSelector.classList.add('portal-application-context__select');
            }
            if (liveSelector.style.getPropertyValue('float')) liveSelector.style.removeProperty('float');
            if (context) {
                if (context.parentElement !== mount) mount.appendChild(context);
                if (!context.contains(liveSelector)) {
                    context.querySelector('.portal-application-context__value').replaceChildren(liveSelector);
                }
                context.querySelector('label').htmlFor = liveSelector.id;
            } else {
                context = document.createElement('section');
                context.className = 'portal-application-context';
                context.setAttribute('aria-label', 'Application selection');
                const inner = document.createElement('div');
                inner.className = 'portal-application-context__inner';
                const label = document.createElement('label');
                label.className = 'portal-application-context__label';
                label.textContent = 'Application';
                const value = document.createElement('div');
                value.className = 'portal-application-context__value';

                if (!liveSelector.id) liveSelector.id = 'portalApplicationSelect';
                label.htmlFor = liveSelector.id;
                value.appendChild(liveSelector);
                inner.append(label, value);
                context.appendChild(inner);

                const chips = mount.querySelector('.portal-chips, .bdd-dynamic-hero__facts');
                if (chips) chips.before(context);
                else mount.appendChild(context);
            }

        }
        window.initializePortalApplicationContext = initializePortalApplicationContext;
        new MutationObserver(initializePortalApplicationContext).observe(document.documentElement, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['onchange', 'style', 'class', 'hidden']
        });
        initializePortalApplicationContext();
    })();
</script>
